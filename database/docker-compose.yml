version: "3.9"

services:
  db:
    image: postgres:16
    container_name: fundeka_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - fundeka_pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: fundeka_adminer
    restart: always
    ports:
      - "8100:8080"

volumes:
  fundeka_pgdata: